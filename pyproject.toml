[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-mem"
version = "0.1.0"
description = "NOVA-Mem: evaluating retrieval and memory strategies for long-horizon conversational AI on LongMemEval (cleaned)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyyaml>=6.0", "tqdm>=4.66",
  "requests>=2.31", "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
models = ["sentence-transformers>=2.7"]
dev = ["pytest>=8.0", "matplotlib>=3.8", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
