name: tests

on:
  push:
    branches: [main]
    # The audit report is documentation-only; report edits do not need to
    # repeat the software test suite.
    paths-ignore:
      - "GITHUB_PUBLICATION_REPORT.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "GITHUB_PUBLICATION_REPORT.md"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      # rank-bm25 is required by the BM25, hybrid and RRF retrieval test paths.
      - name: Assert rank-bm25 present
        run: python -c "import rank_bm25; print('rank_bm25', rank_bm25.__version__ if hasattr(rank_bm25,'__version__') else 'installed')"

      # Datasets are intentionally not downloaded in CI. Dataset-dependent
      # checks may skip when those local files are absent.
      - name: Run offline test suite
        run: python -m pytest tests/
