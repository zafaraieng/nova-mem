# frozen_v0 — Phase-2 config freeze (pre-pilot). Superseded by frozen_v1 at gate G2.
# This file pins every experimental parameter used in smoke tests and pilots.
# Structural mirror of local.yaml + evaluation.yaml + models.yaml choices;
# any change requires a new frozen file (v1, v2, ...) — never edit in place.
freeze: v0
date: 2026-11-07
dataset:
  source: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned
  files:
    longmemeval_oracle.json: 821a2034d219ab45846873dd14c14f12cfe7776e73527a483f9dac095d38620c
    longmemeval_s_cleaned.json: d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442
  split: splits/dev_test_v0.json
  split_seed: 42
  dev_size: 100
prompt_version: v1             # nova_mem.memory.prompts.REGISTRY_VERSION
systems:
  A_no_memory: {cot: false}
  B_full_context: {top_k: null, max_history_chars: null}   # Profile 2
  oracle_context: {}
  C_rag: {retriever: bm25, granularity: session, top_k: 5, user_only_index: true, con: true}
  C_rag_dense: {retriever: dense, granularity: session, top_k: 5, user_only_index: true, con: true}
  D_rag_rerank: {retriever: bm25, top_n: 25, top_k_final: 5, granularity: session, con: true}
  E_structured: {top_k: 10, include_evidence: true, latest_first: true}
statistics:
  primary_family: [C_vs_A, D_vs_C, E_vs_C, oracle_vs_C]
  alpha: 0.05
  correction: holm
  bootstrap_resamples: 10000
  bootstrap_seed: 42
